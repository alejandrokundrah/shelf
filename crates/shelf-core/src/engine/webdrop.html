<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf8ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131a" media="(prefers-color-scheme: dark)">
<title>Send to Shelf</title>
<style>
/* Material 3 color roles, light and dark. No external fonts or images: this page is served
   from a PC on the local network and must work without internet. */
:root {
  color-scheme: light dark;
  --bg: #faf8ff;
  --surface: #f1f0f7;
  --surface-high: #e7e7ef;
  --on-surface: #1a1b22;
  --on-variant: #44474f;
  --outline: #74777f;
  --outline-variant: #c4c6d0;
  --primary: #305fa8;
  --on-primary: #ffffff;
  --primary-container: #d7e3ff;
  --on-primary-container: #001b3e;
  --ok: #1b6d3a;
  --ok-container: #b7f2c3;
  --on-ok-container: #00210c;
  --err: #ba1a1a;
  --err-container: #ffdad6;
  --on-err-container: #410002;
  --elev1: 0 1px 2px rgba(0,0,0,.18), 0 1px 3px 1px rgba(0,0,0,.08);
  --elev3: 0 1px 3px rgba(0,0,0,.2), 0 4px 8px 3px rgba(0,0,0,.1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11131a;
    --surface: #1b1d26;
    --surface-high: #272a34;
    --on-surface: #e3e2ec;
    --on-variant: #c4c6d0;
    --outline: #8e9099;
    --outline-variant: #44474f;
    --primary: #aec6ff;
    --on-primary: #002e69;
    --primary-container: #1c4585;
    --on-primary-container: #d7e3ff;
    --ok: #9bd6a7;
    --ok-container: #1b5130;
    --on-ok-container: #b7f2c3;
    --err: #ffb4ab;
    --err-container: #93000a;
    --on-err-container: #ffdad6;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0; color: var(--on-surface); background: var(--bg);
  font: 400 16px/1.5 Roboto, "Google Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
           max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { max-width: 520px; margin: 0 auto; }
svg { display: block; width: 24px; height: 24px; fill: currentColor; flex: none; }

/* Header */
header { display: flex; align-items: center; gap: 16px; margin: 4px 4px 20px; }
.logo {
  width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center;
  background: var(--primary-container); color: var(--on-primary-container); flex: none;
}
h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 500; overflow-wrap: anywhere; }
.sub { margin: 2px 0 0; color: var(--on-variant); font-size: 14px; line-height: 20px; }

/* Banner (link expired, etc.) */
.banner {
  display: flex; gap: 12px; align-items: flex-start; margin: 0 0 16px; padding: 14px 16px;
  border-radius: 16px; background: var(--err-container); color: var(--on-err-container);
  font-size: 14px; line-height: 20px;
}
.banner[hidden] { display: none; }

/* Drop card: the whole card is one big tap target */
.drop {
  position: relative; display: flex; flex-direction: column; align-items: center; text-align: center;
  gap: 4px; padding: 28px 20px 24px; border-radius: 28px; cursor: pointer; overflow: hidden;
  background: var(--surface); border: 2px dashed var(--outline-variant);
  transition: background-color .2s, border-color .2s;
}
.drop.over { background: var(--primary-container); border-color: var(--primary); }
.drop:focus-within { outline: 3px solid var(--primary); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }
.drop-icon {
  width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin-bottom: 8px;
  background: var(--primary-container); color: var(--on-primary-container);
}
.drop-icon svg { width: 36px; height: 36px; }
.drop-title { font-size: 20px; line-height: 28px; font-weight: 500; }
.drop-sub { color: var(--on-variant); font-size: 14px; line-height: 20px; }

/* Buttons */
.btn {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 56px; padding: 0 24px 0 20px; border: 0; border-radius: 16px; margin-top: 18px;
  font-family: inherit; font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .1px; cursor: pointer;
  overflow: hidden; user-select: none;
}
.btn::after { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity .15s; }
.btn:active::after { opacity: .16; }
@media (hover: hover) { .btn:hover::after { opacity: .08; } }
.btn-primary { background: var(--primary); color: var(--on-primary); box-shadow: var(--elev3); }
.btn-tonal {
  height: 48px; width: 100%; margin-top: 4px; border-radius: 24px; padding: 0 24px;
  background: var(--primary-container); color: var(--on-primary-container);
}
.btn-tonal[hidden] { display: none; }

/* Transfers */
section[hidden] { display: none; }
.head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 28px 4px 10px; }
h2 { margin: 0; font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; color: var(--on-variant); }
.chip {
  display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 8px;
  background: var(--surface-high); color: var(--on-variant); font-size: 12px; font-weight: 500; letter-spacing: .5px;
}
/* minmax(0, 1fr) and min-width: 0 keep a long file name from stretching the column past the screen. */
ul { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.item {
  min-width: 0; display: flex; gap: 14px; align-items: center; padding: 12px 16px 12px 12px; border-radius: 20px;
  background: var(--surface); box-shadow: var(--elev1); animation: in .25s ease-out;
}
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.lead {
  width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none;
  background: var(--surface-high); color: var(--on-variant); transition: background-color .2s, color .2s;
}
.item.go .lead { background: var(--primary-container); color: var(--on-primary-container); }
.item.ok .lead { background: var(--ok-container); color: var(--on-ok-container); }
.item.bad .lead { background: var(--err-container); color: var(--on-err-container); }
.body { flex: 1; min-width: 0; }
.name { font-size: 16px; line-height: 24px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; justify-content: space-between; gap: 12px; color: var(--on-variant); font-size: 13px; line-height: 18px; }
.status { text-align: right; white-space: nowrap; }
.item.ok .status { color: var(--ok); font-weight: 500; }
.item.bad .status { color: var(--err); font-weight: 500; }
.progress { height: 4px; border-radius: 2px; margin-top: 8px; background: var(--surface-high); overflow: hidden; }
.item.go .progress { background: var(--outline-variant); }
.progress i { display: block; height: 100%; width: 0; border-radius: 2px; background: var(--primary); transition: width .15s linear, background-color .2s; }
.item.ok .progress i { background: var(--ok); }
.item.bad .progress i { background: var(--err); }

/* Secondary actions under the drop card */
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.actions .btn-tonal { margin-top: 0; padding: 0 12px; white-space: nowrap; }
.actions .btn-tonal.on { background: var(--primary); color: var(--on-primary); }
.compose { margin-top: 12px; display: grid; gap: 12px; }
.compose[hidden] { display: none; }
textarea {
  width: 100%; min-height: 120px; max-height: 40vh; resize: vertical; padding: 14px 16px; border-radius: 16px;
  border: 1px solid var(--outline); background: var(--surface); color: var(--on-surface);
  font: inherit; line-height: 24px;
}
textarea:focus { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
.btn-primary[disabled] { opacity: .38; box-shadow: none; cursor: default; }
.compose .btn-primary { margin-top: 0; width: 100%; height: 48px; border-radius: 24px; }

/* Items the PC has shared with the phone */
.save {
  flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 18px; border-radius: 20px;
  background: var(--primary-container); color: var(--on-primary-container); text-decoration: none;
  font-size: 14px; font-weight: 500; letter-spacing: .1px;
}
.save:active { opacity: .7; }
#offers { margin-bottom: 20px; }
#offers .head { margin-top: 4px; }

.foot { margin: 20px 8px 0; color: var(--on-variant); font-size: 12px; line-height: 16px; text-align: center; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg></div>
    <div>
      <h1>Send to {{NAME}}</h1>
      <p class="sub">Send photos, files, folders and text to that PC, or save what it shares with you.</p>
    </div>
  </header>

  <div id="banner" class="banner" role="alert" hidden></div>

  <section id="offers" hidden>
    <div class="head"><h2>From this PC</h2><span id="offerCount" class="chip"></span></div>
    <ul id="offerList"></ul>
  </section>

  <label class="drop" id="drop">
    <input id="files" class="sr" type="file" multiple>
    <span class="drop-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg></span>
    <span class="drop-title">Tap to pick files</span>
    <span class="drop-sub">Photos, videos, documents, anything</span>
    <span class="btn btn-primary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>Choose files</span>
  </label>

  <div class="actions">
    <button id="pickFolder" class="btn btn-tonal" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>Choose folder</button>
    <button id="toggleText" class="btn btn-tonal" type="button" aria-expanded="false" aria-controls="compose"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h12v-2H3v2zM3 6v2h18V6H3zm0 7h18v-2H3v2z"/></svg>Send text</button>
  </div>
  <input id="folderFiles" class="sr" type="file" webkitdirectory multiple tabindex="-1" aria-hidden="true">

  <div id="compose" class="compose" hidden>
    <textarea id="note" placeholder="Type or paste text to send to the PC" aria-label="Text to send"></textarea>
    <button id="sendNote" class="btn btn-primary" type="button" disabled>Send</button>
  </div>

  <section id="results" hidden>
    <div class="head"><h2>Transfers</h2><span id="summary" class="chip"></span></div>
    <ul id="list"></ul>
    <button id="again" class="btn btn-tonal" type="button" hidden>Retry failed</button>
  </section>

  <p class="foot">Sent directly to your PC over this Wi-Fi. Nothing goes through the internet.</p>
</main>
<script>
(function () {
  var ICON = {
    file: "M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z",
    image: "M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z",
    folder: "M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z",
    text: "M3 18h12v-2H3v2zM3 6v2h18V6H3zm0 7h18v-2H3v2z",
    ok: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z",
    bad: "M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z",
    error: "M12 5.99L19.53 19H4.47L12 5.99M12 2L1 21h22L12 2zm1 14h-2v2h2v-2zm0-6h-2v4h2v-4z"
  };
  function svg(path) {
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + path + '"/></svg>';
  }

  var MAX_FOLDER_FILES = 20000;      // same limit as the PC
  var MAX_TEXT_BYTES = 1048576;      // 1 MB, same as text between paired PCs
  var MAX_PATH_CHARS = 4000;         // encoded URL path; the PC reads at most 16 KB of headers
  var JUNK = /^(\.DS_Store|Thumbs\.db|desktop\.ini)$/i;

  var base = location.pathname.replace(/\/+$/, "");
  var input = document.getElementById("files");
  var folderInput = document.getElementById("folderFiles");
  var pickFolder = document.getElementById("pickFolder");
  var toggleText = document.getElementById("toggleText");
  var compose = document.getElementById("compose");
  var note = document.getElementById("note");
  var sendNote = document.getElementById("sendNote");
  var drop = document.getElementById("drop");
  var results = document.getElementById("results");
  var list = document.getElementById("list");
  var again = document.getElementById("again");
  var banner = document.getElementById("banner");
  var summary = document.getElementById("summary");
  var queue = [], busy = false, failed = [], jobs = [];

  function size(n) {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  function showBanner(message) {
    banner.innerHTML = svg(ICON.error) + "<span></span>";
    banner.lastChild.textContent = message;
    banner.hidden = false;
    window.scrollTo(0, 0);
  }

  function refresh() {
    var sent = 0, bad = 0, waiting = 0, parts = [];
    jobs.forEach(function (j) {
      if (j.result === "ok") sent++; else if (j.result === "bad") bad++; else waiting++;
    });
    if (sent) parts.push(sent + " sent");
    if (waiting) parts.push(waiting + " waiting");
    if (bad) parts.push(bad + " failed");
    summary.textContent = parts.join(" · ");
    again.hidden = failed.length === 0;
  }

  function mark(job, cls, status, icon) {
    job.li.className = "item " + cls;
    job.status.textContent = status;
    if (icon) job.lead.innerHTML = svg(icon);
  }

  function idleIcon(job) {
    if (job.kind === "folder") return ICON.folder;
    if (job.kind === "text") return ICON.text;
    return (job.file.type || "").indexOf("image/") === 0 ? ICON.image : ICON.file;
  }

  // One row in the list for every file, folder or text note.
  function row(job, name, info) {
    var li = document.createElement("li");
    li.className = "item";
    var lead = document.createElement("span");
    lead.className = "lead";
    var body = document.createElement("div");
    body.className = "body";
    var nameEl = document.createElement("div");
    nameEl.className = "name";
    nameEl.textContent = name;
    var meta = document.createElement("div");
    meta.className = "meta";
    var infoEl = document.createElement("span");
    infoEl.textContent = info;
    var status = document.createElement("span");
    status.className = "status";
    status.textContent = "Waiting";
    meta.appendChild(infoEl); meta.appendChild(status);
    var bar = document.createElement("div");
    bar.className = "progress";
    var fill = document.createElement("i");
    bar.appendChild(fill);
    body.appendChild(nameEl); body.appendChild(meta); body.appendChild(bar);
    li.appendChild(lead); li.appendChild(body);
    list.insertBefore(li, list.firstChild);
    results.hidden = false;
    job.li = li; job.lead = lead; job.status = status; job.info = infoEl; job.fill = fill; job.result = "";
    lead.innerHTML = svg(idleIcon(job));
    jobs.push(job);
    refresh();
    return job;
  }

  function addFile(file) {
    return row({ kind: "file", file: file }, file.name || "file", size(file.size));
  }

  function newBatch() {
    var bytes = new Uint8Array(8), out = "";
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
    else for (var i = 0; i < 8; i++) bytes[i] = Math.floor(Math.random() * 256);
    for (var j = 0; j < 8; j++) out += ("0" + bytes[j].toString(16)).slice(-2);
    return out;
  }

  function addFolder(root, entries) {
    var total = 0;
    entries.forEach(function (e) { total += e.file.size; });
    var job = { kind: "folder", root: root, entries: entries, total: total, sent: 0, index: 0, batch: newBatch(), file: { type: "" } };
    return row(job, root, plural(entries.length, "file") + " · " + size(total));
  }

  function addText(text) {
    var bytes = new Blob([text]).size;
    return row({ kind: "text", text: text, file: { type: "" } }, "Text", size(bytes));
  }

  function finish(job, result, cls, text, icon) {
    job.result = result;
    if (result === "ok") job.fill.style.width = "100%";
    if (result === "bad") failed.push(job);
    mark(job, cls, text, icon);
    refresh();
    next();
  }

  function failWith(job, status, expiredOn404) {
    if (status === 404 && expiredOn404) {
      showBanner("This link has expired. Scan the QR code on the PC again.");
      finish(job, "bad", "bad", "Link expired", ICON.bad);
    } else if (status === 503) {
      finish(job, "bad", "bad", "PC is not receiving", ICON.bad);
    } else if (status === 0) {
      finish(job, "bad", "bad", "Connection lost", ICON.bad);
    } else if (status === 413) {
      finish(job, "bad", "bad", "Too large", ICON.bad);
    } else {
      finish(job, "bad", "bad", "Failed", ICON.bad);
    }
  }

  function request(method, path, headers, body, onprogress, done) {
    var xhr = new XMLHttpRequest();
    xhr.open(method, base + path);
    for (var key in headers) xhr.setRequestHeader(key, headers[key]);
    if (onprogress) xhr.upload.onprogress = onprogress;
    xhr.onload = function () { done(xhr.status, xhr.responseText || ""); };
    xhr.onerror = xhr.ontimeout = function () { done(0, ""); };
    xhr.send(body);
  }

  function setPercent(job, done, total) {
    var pct = total > 0 ? Math.min(100, Math.round(done * 100 / total)) : 100;
    job.fill.style.width = pct + "%";
    job.status.textContent = pct + "%";
  }

  function sendFile(job) {
    request("PUT", "/" + encodeURIComponent(job.file.name || "file"), {}, job.file,
      function (e) { if (e.lengthComputable) setPercent(job, e.loaded, e.total); },
      function (status, text) {
        if (status === 200) {
          finish(job, "ok", "ok", /duplicate/.test(text) ? "Already on the shelf" : "Sent", ICON.ok);
        } else {
          failWith(job, status, true);
        }
      });
  }

  function sendText(job) {
    request("POST", "/text", { "Content-Type": "text/plain; charset=utf-8" }, job.text, null,
      function (status, text) {
        if (status === 200) {
          finish(job, "ok", "ok", /duplicate/.test(text) ? "Already on the shelf" : "Sent", ICON.ok);
        } else {
          failWith(job, status, true);
        }
      });
  }

  // A folder goes up one file at a time into a hidden staging folder on the PC. The PC shows
  // it as a single item only after the last file, so nothing half-sent ever appears. A retry
  // continues from the file that failed.
  function sendFolder(job) {
    if (job.index >= job.entries.length) {
      request("POST", "/folder/" + job.batch + "/done", {}, null, null, function (status) {
        if (status === 200) {
          job.info.textContent = plural(job.entries.length, "file") + " · " + size(job.total);
          finish(job, "ok", "ok", "Sent", ICON.ok);
        } else {
          failWith(job, status, false);
        }
      });
      return;
    }
    var entry = job.entries[job.index];
    var path = "/folder/" + job.batch + "/" + entry.rel.split("/").map(encodeURIComponent).join("/");
    if (path.length > MAX_PATH_CHARS) {
      finish(job, "bad", "bad", "Path too long", ICON.bad);
      return;
    }
    job.info.textContent = "File " + (job.index + 1) + " of " + job.entries.length + " · " + size(job.total);
    request("PUT", path, { "X-Shelf-Total": String(job.total), "X-Shelf-Done": String(job.sent) }, entry.file,
      function (e) { if (e.lengthComputable) setPercent(job, job.sent + e.loaded, job.total); },
      function (status) {
        if (status === 200) {
          job.sent += entry.file.size;
          job.index++;
          setPercent(job, job.sent, job.total);
          sendFolder(job);
        } else {
          failWith(job, status, true);
        }
      });
  }

  function send(job) {
    mark(job, "go", "0%");
    if (job.kind === "folder") {
      setPercent(job, job.sent, job.total);
      sendFolder(job);
    } else if (job.kind === "text") {
      sendText(job);
    } else {
      sendFile(job);
    }
  }

  function next() {
    var job = queue.shift();
    if (!job) { busy = false; return; }
    busy = true; send(job);
  }

  function push(job) {
    queue.push(job);
    if (!busy) next();
  }

  // ---- files

  function enqueueFiles(files) {
    for (var i = 0; i < files.length; i++) queue.push(addFile(files[i]));
    if (!busy) next();
  }

  // ---- folders

  function enqueueFolder(root, entries) {
    entries = entries.filter(function (e) { return !JUNK.test(e.file.name); });
    if (!entries.length) {
      showBanner("“" + root + "” has no files to send.");
      return;
    }
    if (entries.length > MAX_FOLDER_FILES) {
      showBanner("“" + root + "” has more than " + MAX_FOLDER_FILES + " files. Send it in smaller parts.");
      return;
    }
    entries.sort(function (a, b) { return a.rel < b.rel ? -1 : a.rel > b.rel ? 1 : 0; });
    push(addFolder(root, entries));
  }

  // Files picked with "Choose folder". Browsers that cannot pick folders give plain files,
  // which are sent as such.
  function enqueuePickedFolder(files) {
    var groups = {}, order = [], plain = [];
    for (var i = 0; i < files.length; i++) {
      var f = files[i], rel = f.webkitRelativePath || "";
      if (!rel || rel.indexOf("/") < 0) { plain.push(f); continue; }
      var root = rel.split("/")[0];
      if (!groups[root]) { groups[root] = []; order.push(root); }
      groups[root].push({ file: f, rel: rel });
    }
    order.forEach(function (root) { enqueueFolder(root, groups[root]); });
    if (plain.length) enqueueFiles(plain);
  }

  // Reads every file under a dropped folder (drag and drop from a computer browser).
  function walk(dir, prefix, out, done) {
    var reader = dir.createReader(), pending = 1;
    function dec() { if (--pending === 0) done(); }
    function more() {
      reader.readEntries(function (entries) {
        if (!entries.length) { dec(); return; }
        entries.forEach(function (entry) {
          if (entry.isFile) {
            pending++;
            entry.file(function (f) { out.push({ file: f, rel: prefix + "/" + entry.name }); dec(); }, function () { dec(); });
          } else if (entry.isDirectory) {
            pending++;
            walk(entry, prefix + "/" + entry.name, out, dec);
          }
        });
        more();
      }, function () { dec(); });
    }
    more();
  }

  function enqueueEntries(entries) {
    entries.forEach(function (entry) {
      if (entry.isDirectory) {
        var out = [];
        walk(entry, entry.name, out, function () { enqueueFolder(entry.name, out); });
      } else if (entry.isFile) {
        entry.file(function (f) { enqueueFiles([f]); });
      }
    });
  }

  // ---- text

  function updateNote() { sendNote.disabled = note.value.trim() === ""; }
  note.addEventListener("input", updateNote);
  toggleText.addEventListener("click", function () {
    var open = compose.hidden;
    compose.hidden = !open;
    toggleText.classList.toggle("on", open);
    toggleText.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) note.focus();
  });
  sendNote.addEventListener("click", function () {
    var text = note.value;
    if (text.trim() === "") return;
    if (new Blob([text]).size > MAX_TEXT_BYTES) {
      showBanner("That text is longer than 1 MB. Send it as a file instead.");
      return;
    }
    banner.hidden = true;
    note.value = "";
    updateNote();
    push(addText(text));
  });

  // ---- items the PC shares with the phone

  var offersBox = document.getElementById("offers");
  var offerList = document.getElementById("offerList");
  var offerCount = document.getElementById("offerCount");
  var offerKey = "[]", offerTimer = 0;

  function renderOffers(items) {
    var key = JSON.stringify(items);
    if (key === offerKey) return;       // leave the list alone while nothing changed
    offerKey = key;
    offerList.innerHTML = "";
    items.forEach(function (it) {
      var li = document.createElement("li");
      li.className = "item";
      var lead = document.createElement("span");
      lead.className = "lead";
      lead.innerHTML = svg(it.dir ? ICON.folder : ICON.file);
      var body = document.createElement("div");
      body.className = "body";
      var name = document.createElement("div");
      name.className = "name";
      name.textContent = it.name;
      var meta = document.createElement("div");
      meta.className = "meta";
      var info = document.createElement("span");
      info.textContent = it.dir ? "Folder as .zip · " + size(it.size) : size(it.size);
      meta.appendChild(info);
      body.appendChild(name); body.appendChild(meta);
      var save = document.createElement("a");
      save.className = "save";
      save.textContent = "Save";
      save.href = base + "/get/" + encodeURIComponent(it.id);
      save.setAttribute("download", it.dir ? it.name + ".zip" : it.name);
      li.appendChild(lead); li.appendChild(body); li.appendChild(save);
      offerList.appendChild(li);
    });
    offersBox.hidden = items.length === 0;
    offerCount.textContent = items.length === 1 ? "1 item" : items.length + " items";
  }

  function pollOffers() {
    var xhr = new XMLHttpRequest();
    xhr.open("GET", base + "/offers");
    xhr.onload = function () {
      if (xhr.status === 200) {
        try { renderOffers(JSON.parse(xhr.responseText)); } catch (e) { /* keep what is shown */ }
      } else if (xhr.status === 404) {
        clearInterval(offerTimer);
        showBanner("This link has expired. Scan the QR code on the PC again.");
      }
    };
    xhr.send();   // a network error is ignored; the next poll tries again
  }
  offerTimer = setInterval(function () { if (!document.hidden) pollOffers(); }, 3000);
  pollOffers();

  // ---- wiring

  input.addEventListener("change", function () {
    if (input.files && input.files.length) { enqueueFiles(input.files); }
    input.value = "";
  });
  pickFolder.addEventListener("click", function () { folderInput.click(); });
  folderInput.addEventListener("change", function () {
    if (folderInput.files && folderInput.files.length) { enqueuePickedFolder(folderInput.files); }
    folderInput.value = "";
  });
  again.addEventListener("click", function () {
    var retry = failed; failed = [];
    banner.hidden = true;
    retry.forEach(function (j) {
      j.result = "";
      j.fill.style.width = j.kind === "folder" && j.total > 0 ? Math.round(j.sent * 100 / j.total) + "%" : "0";
      mark(j, "", "Waiting", idleIcon(j));
      queue.push(j);
    });
    refresh();
    if (!busy) next();
  });

  // Also works from a laptop browser: drag files or folders onto the card.
  ["dragenter", "dragover"].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (t) {
    drop.addEventListener(t, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    var dt = e.dataTransfer;
    if (!dt) return;
    // Entries must be taken from the event right away; they are gone once it returns.
    if (dt.items && dt.items.length && dt.items[0].webkitGetAsEntry) {
      var entries = [];
      for (var i = 0; i < dt.items.length; i++) {
        if (dt.items[i].kind !== "file") continue;
        var entry = dt.items[i].webkitGetAsEntry();
        if (entry) entries.push(entry);
      }
      if (entries.length) { enqueueEntries(entries); return; }
    }
    if (dt.files && dt.files.length) enqueueFiles(dt.files);
  });
})();
</script>
</body>
</html>
