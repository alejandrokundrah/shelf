[package]
name = "shelf"
version = "0.1.0"
edition = "2021"

[dependencies]
shelf-core = { path = "../shelf-core" }
eframe = "0.29"
arboard = "3"
png = "0.17"
image = "0.25"
anyhow = "1"
tray-icon = "0.19"
global-hotkey = "0.8"
notify-rust = "4"
qrcode = "0.14"
rfd = "0.16"

# Native drag-out of shelf items into other apps (Windows only; this app only runs there).
[target.'cfg(windows)'.dependencies]
drag = "2.1"
